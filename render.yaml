envVarGroups:
  - name: alpha-media-internal
    envVars:
      - key: INTERNAL_GATEWAY_TOKEN
        generateValue: true

services:
  - type: web
    name: alpha-media-service
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/service/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: alpha-media-internal
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=1 -Xss512k
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        value: alpha_media_app
      - key: DB_PASSWORD
        sync: false
      - key: DB_MIGRATION_URL
        sync: false
      - key: DB_MIGRATION_USERNAME
        sync: false
      - key: DB_MIGRATION_PASSWORD
        sync: false
      - key: DB_CONNECTION_TIMEOUT
        value: "10000"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_CLEANUP_CRON
        value: "0 0 * * * *"
      - key: MOCK_PG_ENABLED
        value: "true"
      - key: MOCK_PG_API_KEY
        sync: false
      - key: PG_WEBHOOK_SECRET
        sync: false
      # Preserve this 32-byte Base64 key to decrypt persisted webhook payloads.
      - key: WEBHOOK_INBOX_ENCRYPTION_KEY
        sync: false
      - key: PG_WEBHOOK_URL
        value: https://alpha-media-gateway.onrender.com/webhooks/pg
      - key: MOCK_SUPPLIER_ENABLED
        value: "true"
      - key: SUPPLIER_API_KEY
        sync: false
      - key: SUPPLIER_WEBHOOK_SECRET
        sync: false
      - key: SUPPLIER_WEBHOOK_URL
        value: https://alpha-media-gateway.onrender.com/webhooks/supplier

  - type: web
    name: alpha-media-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/gateway/Dockerfile
    healthCheckPath: /health
    envVars:
      - fromGroup: alpha-media-internal
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:ActiveProcessorCount=1 -Xss512k
      - key: SERVICE_BASE_URL
        fromService:
          type: web
          name: alpha-media-service
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://localhost:3000,https://127.0.0.1:3000,https://alpha-media-mauve.vercel.app
      - key: SERVICE_CONNECT_TIMEOUT
        value: 10s
      - key: SERVICE_READ_TIMEOUT
        value: 90s
