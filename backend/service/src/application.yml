spring:
  config:
    # 로컬 접속 정보만 .env에 보관한다. 배포 환경변수가 같은 이름의 값을 덮어쓸 수 있다.
    import: optional:file:./.env[.properties]
  application:
    name: service
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/alpha_media}
    username: ${DB_USERNAME:alpha_media_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      # 사용하지 않는 연결은 반납해 Neon의 절전을 방해하지 않는다.
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
      connection-timeout: ${DB_CONNECTION_TIMEOUT:3000}
  flyway:
    # Neon의 트랜잭션 풀러 대신 direct 연결에서 마이그레이션 잠금을 사용한다.
    url: ${DB_MIGRATION_URL:${DB_URL:jdbc:postgresql://127.0.0.1:5432/alpha_media}}
    user: ${DB_MIGRATION_USERNAME:alpha_media_owner}
    password: ${DB_MIGRATION_PASSWORD}
    placeholders:
      customer1PasswordHash: ${CUSTOMER1_PASSWORD_HASH}
      customer2PasswordHash: ${CUSTOMER2_PASSWORD_HASH}
      adminPasswordHash: ${ADMIN_PASSWORD_HASH}
  session:
    timeout: 30m
    jdbc:
      # 테이블 생성은 Flyway 마이그레이션 한 곳에서 관리한다.
      initialize-schema: never
      cleanup-cron: ${SESSION_CLEANUP_CRON:0 * * * * *}
  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  # Gateway는 8080, 업무 API를 처리하는 Service는 8081에서 실행한다.
  port: ${PORT:8081}
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        name: ALPHA_SESSION
        path: /
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

payment:
  mock-enabled: ${MOCK_PG_ENABLED:false}
  pg-base-url: ${MOCK_PG_BASE_URL:http://127.0.0.1:${server.port}/internal/mock-pg}
  webhook-url: ${PG_WEBHOOK_URL:http://127.0.0.1:8080/webhooks/pg}
  api-key: ${MOCK_PG_API_KEY:}
  webhook-secret: ${PG_WEBHOOK_SECRET:}
  http-timeout-ms: ${PG_HTTP_TIMEOUT_MS:2000}
  lease-ms: ${PAYMENT_LEASE_MS:30000}
  retry-base-ms: ${PAYMENT_RETRY_BASE_MS:1000}
  worker-delay-ms: ${PAYMENT_WORKER_DELAY_MS:500}

issuance:
  mock-enabled: ${MOCK_SUPPLIER_ENABLED:false}
  base-url: ${SUPPLIER_BASE_URL:http://127.0.0.1:${server.port}/internal/mock-supplier}
  webhook-url: ${SUPPLIER_WEBHOOK_URL:http://127.0.0.1:8080/webhooks/supplier}
  api-key: ${SUPPLIER_API_KEY:}
  webhook-secret: ${SUPPLIER_WEBHOOK_SECRET:}
  http-timeout-ms: ${SUPPLIER_HTTP_TIMEOUT_MS:2000}
  lease-ms: ${ISSUANCE_LEASE_MS:30000}
  poll-ms: ${ISSUANCE_POLL_MS:5000}
  worker-delay-ms: ${ISSUANCE_WORKER_DELAY_MS:500}
  completion-delay-ms: ${SUPPLIER_COMPLETION_DELAY_MS:1000}
